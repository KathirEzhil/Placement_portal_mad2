openapi: 3.0.3

info:
  title: Placement Park API
  description: REST API for the Placement Park placement management portal.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:5000
    description: Local development server

tags:
  - name: Authentication
  - name: Student
  - name: Company
  - name: Admin
  - name: Analytics
  - name: Recruitment
  - name: Export

paths:

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a student or company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid request
        '409':
          description: Email already registered

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout the authenticated user
      responses:
        '200':
          description: Logged out successfully

  /student/profile:
    get:
      tags: [Student]
      summary: Get student profile
      responses:
        '200': {description: Student profile retrieved}
        '404': {description: Student profile not found}
    put:
      tags: [Student]
      summary: Create or update student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProfile'
      responses:
        '200': {description: Profile updated successfully}
        '400': {description: Validation error}

  /student/upload-resume:
    post:
      tags: [Student]
      summary: Upload student resume
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        '200': {description: Resume uploaded successfully}
        '400': {description: Invalid or missing file}

  /student/view-resume:
    get:
      tags: [Student]
      summary: View the student's resume
      responses:
        '200':
          description: Resume file
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '404': {description: Resume not found}

  /student/drives:
    get:
      tags: [Student]
      summary: Get approved placement drives
      responses:
        '200': {description: Approved placement drives retrieved}

  /student/drives/{drive_id}:
    get:
      tags: [Student]
      summary: Get details of a placement drive
      parameters:
        - $ref: '#/components/parameters/DriveId'
      responses:
        '200': {description: Placement drive retrieved}
        '404': {description: Placement drive not found}

  /student/drives/{drive_id}/apply:
    post:
      tags: [Student]
      summary: Apply or reapply for a placement drive
      parameters:
        - $ref: '#/components/parameters/DriveId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cover_letter: {type: string}
      responses:
        '201': {description: Application submitted successfully}
        '400': {description: Application or eligibility validation failed}
        '409': {description: Application already exists}

  /student/applications:
    get:
      tags: [Student]
      summary: Get all student applications
      responses:
        '200': {description: Applications retrieved}

  /student/applications/{application_id}:
    get:
      tags: [Student]
      summary: Get a student application
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200': {description: Application details retrieved}
        '404': {description: Application not found}

  /student/applications/{application_id}/withdraw:
    put:
      tags: [Student]
      summary: Withdraw a student application
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200': {description: Application withdrawn}
        '400': {description: Withdrawal not allowed}

  /student/applications/{application_id}/recruitment:
    get:
      tags: [Student]
      summary: Get recruitment progress
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200': {description: Recruitment details retrieved}
        '404': {description: Recruitment process not found}

  /student/applications/{application_id}/offer-letter:
    get:
      tags: [Student]
      summary: Download generated offer letter
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Offer letter PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '404': {description: Offer letter not found}

  /company/profile:
    get:
      tags: [Company]
      summary: Get company profile
      responses:
        '200': {description: Company profile retrieved}
        '404': {description: Company profile not found}
    put:
      tags: [Company]
      summary: Create or update company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfile'
      responses:
        '200': {description: Company profile updated}
        '400': {description: Validation error}

  /company/upload-logo:
    post:
      tags: [Company]
      summary: Upload company logo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        '200': {description: Logo uploaded successfully}
        '400': {description: Invalid or missing logo}

  /company/view-logo:
    get:
      tags: [Company]
      summary: View company logo
      responses:
        '200': {description: Company logo}
        '404': {description: Logo not found}

  /company/dashboard:
    get:
      tags: [Company]
      summary: Get company dashboard
      responses:
        '200': {description: Company dashboard retrieved}

  /company/drives:
    get:
      tags: [Company]
      summary: Get company placement drives
      responses:
        '200': {description: Company drives retrieved}
    post:
      tags: [Company]
      summary: Create a placement drive
      responses:
        '201': {description: Placement drive created}
        '400': {description: Validation error}

  /company/drives/{drive_id}:
    get:
      tags: [Company]
      summary: Get company placement drive
      parameters:
        - $ref: '#/components/parameters/DriveId'
      responses:
        '200': {description: Placement drive retrieved}
        '403': {description: Unauthorized access}
        '404': {description: Placement drive not found}

  /company/drive/{drive_id}:
    put:
      tags: [Company]
      summary: Update a placement drive
      parameters:
        - $ref: '#/components/parameters/DriveId'
      responses:
        '200': {description: Placement drive updated}
        '400': {description: Validation error}

  /company/applications/{application_id}/round-result:
    patch:
      tags: [Company]
      summary: Update recruitment round result
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundResultRequest'
      responses:
        '200': {description: Round result updated}
        '400': {description: Invalid round or status}
        '409': {description: Invalid recruitment state}

  /company/applications/{application_id}/generate-offer:
    patch:
      tags: [Recruitment]
      summary: Generate offer letter
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200': {description: Offer letter generated}
        '400': {description: Recruitment not completed or application not selected}
        '409': {description: Offer letter already generated}

  /company/applications/{application_id}/send-offer:
    patch:
      tags: [Recruitment]
      summary: Send offer letter by email
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200': {description: Offer letter sent}
        '400': {description: Offer letter not ready}
        '409': {description: Offer letter already sent}

  /company/applications/{application_id}/recruitment:
    get:
      tags: [Recruitment]
      summary: Get company recruitment details
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200': {description: Recruitment details retrieved}
        '404': {description: Recruitment process not found}

  /company/applications/{application_id}/offer-letter:
    get:
      tags: [Recruitment]
      summary: Download company-side offer letter
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Offer letter PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '404': {description: Offer letter not found}

  /admin/pending-companies:
    get:
      tags: [Admin]
      summary: Get pending company approvals
      responses:
        '200': {description: Pending companies retrieved}

  /admin/company/{company_id}:
    get:
      tags: [Admin]
      summary: Get company details
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200': {description: Company details retrieved}
        '404': {description: Company not found}

  /admin/company/{company_id}/approve:
    put:
      tags: [Admin]
      summary: Approve company
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200': {description: Company approved}

  /admin/company/{company_id}/reject:
    put:
      tags: [Admin]
      summary: Reject company
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200': {description: Company rejected}

  /admin/students:
    get:
      tags: [Admin]
      summary: List students
      responses:
        '200': {description: Students retrieved}

  /admin/companies:
    get:
      tags: [Admin]
      summary: List companies
      responses:
        '200': {description: Companies retrieved}

  /admin/student/{student_id}/status:
    put:
      tags: [Admin]
      summary: Activate or deactivate a student
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusRequest'
      responses:
        '200': {description: Student status updated}

  /admin/company/{company_id}/status:
    put:
      tags: [Admin]
      summary: Activate or deactivate a company
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusRequest'
      responses:
        '200': {description: Company status updated}

  /admin/student/{student_id}/resume:
    get:
      tags: [Admin]
      summary: View student resume
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student resume
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '404': {description: Resume not found}

  /admin/jobs/daily-reminder:
    post:
      tags: [Admin]
      summary: Start daily reminder background job
      responses:
        '202': {description: Background job started}

  /admin/jobs/monthly-report:
    post:
      tags: [Admin]
      summary: Start monthly report background job
      responses:
        '202': {description: Background job started}

  /analytics/admin/dashboard:
    get:
      tags: [Analytics]
      summary: Get admin analytics summary
      responses:
        '200': {description: Admin analytics summary}

  /analytics/admin/recruitment-funnel:
    get:
      tags: [Analytics]
      summary: Get recruitment funnel
      responses:
        '200': {description: Recruitment funnel data}

  /analytics/admin/monthly-trends:
    get:
      tags: [Analytics]
      summary: Get monthly application trends
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200': {description: Monthly trend data}

  /analytics/admin/company-rankings:
    get:
      tags: [Analytics]
      summary: Get company rankings
      responses:
        '200': {description: Company ranking data}

  /analytics/admin/branch-analytics:
    get:
      tags: [Analytics]
      summary: Get branch statistics
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200': {description: Branch statistics}

  /analytics/admin/package-analytics:
    get:
      tags: [Analytics]
      summary: Get package statistics
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200': {description: Package statistics}

  /analytics/admin/drive-performance:
    get:
      tags: [Analytics]
      summary: Get drive performance
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200': {description: Drive performance data}

  /analytics/admin/recent-activities:
    get:
      tags: [Analytics]
      summary: Get recent activities
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 20}
      responses:
        '200': {description: Recent activities}

  /analytics/admin/insights:
    get:
      tags: [Analytics]
      summary: Get admin insights
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200': {description: Admin insights}

  /analytics/company/dashboard:
    get:
      tags: [Analytics]
      summary: Get company analytics dashboard
      responses:
        '200': {description: Company analytics}

  /analytics/student/dashboard:
    get:
      tags: [Analytics]
      summary: Get student dashboard data
      responses:
        '200': {description: Student dashboard}

  /analytics/student/analytics:
    get:
      tags: [Analytics]
      summary: Get student analytics
      responses:
        '200': {description: Student analytics}

  /api/export/student:
    post:
      tags: [Export]
      summary: Start student applications Excel export
      responses:
        '202': {description: Export task started}

  /api/export/company/{drive_id}:
    post:
      tags: [Export]
      summary: Start company applicants Excel export
      parameters:
        - $ref: '#/components/parameters/DriveId'
      responses:
        '202': {description: Export task started}

  /api/export/admin:
    post:
      tags: [Export]
      summary: Start admin placement report Excel export
      responses:
        '202': {description: Export task started}

  /api/export/status/{task_id}:
    get:
      tags: [Export]
      summary: Get export background task status
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Export task status}

  /api/export/download/{filename}:
    get:
      tags: [Export]
      summary: Download generated export
      parameters:
        - name: filename
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Generated Excel export
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '404': {description: File not found}

components:

  parameters:

    DriveId:
      name: drive_id
      in: path
      required: true
      schema: {type: integer}

    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: {type: integer}

    StudentId:
      name: student_id
      in: path
      required: true
      schema: {type: integer}

    CompanyId:
      name: company_id
      in: path
      required: true
      schema: {type: integer}

    Year:
      name: year
      in: query
      schema: {type: integer}

  schemas:

    RegisterRequest:
      type: object
      required: [email, password, confirm_password, role]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
        confirm_password: {type: string, format: password}
        role:
          type: string
          enum: [student, company]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}

    StudentProfile:
      type: object
      properties:
        full_name: {type: string}
        college_email: {type: string, format: email}
        personal_email: {type: string, format: email}
        roll_number: {type: string}
        graduation_year: {type: integer}
        skills: {type: string}
        linkedin_url: {type: string}
        github_url: {type: string}
        portfolio_url: {type: string}
        permanent_address: {type: string}
        college_name: {type: string}
        stream: {type: string}
        branch: {type: string}
        cgpa:
          type: number
          format: float
          minimum: 0
          maximum: 10
        phone: {type: string}
        year: {type: integer}

    CompanyProfile:
      type: object
      properties:
        company_name: {type: string}
        industry_type: {type: string}
        company_domain: {type: string}
        company_size: {type: integer}
        website: {type: string}
        hr_email: {type: string, format: email}
        hr_contact: {type: string}
        location: {type: string}
        govt_verification_id: {type: string}
        description: {type: string}

    RoundResultRequest:
      type: object
      required: [round, status]
      properties:
        round:
          type: integer
          enum: [1, 2, 3, 4]
        status:
          type: string
          enum: [passed, failed, skipped]
        company_notes: {type: string}

    AccountStatusRequest:
      type: object
      required: [is_active]
      properties:
        is_active: {type: boolean}
